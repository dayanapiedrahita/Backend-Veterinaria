name: CI Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: |
          flake8 .

      - name: Formato (black)
        run: |
          black --check .

      - name: Tests (pytest)
        run: |
          pytest

      - name: Seguridad (pip-audit)
        run: |
          pip-audit

      - name: Migraciones
        run: |
          alembic upgrade head

      - name: Seeder
        run: |
          python scripts/seed.py